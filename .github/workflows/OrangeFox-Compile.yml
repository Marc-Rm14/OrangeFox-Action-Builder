name: OrangeFox - Build

# Credits to: TeamWin, OrangeFox, azwhikaru and all Contributors

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '14.1'
        type: choice
        options:
        - 12.1
        - 14.1
      DEVICE_TREE:
        description: 'OrangeFox Device Tree'
        required: true
        default: 'https://github.com/Marc-Rm14/android_device_xiaomi_spinel'
      DEVICE_TREE_BRANCH:
        description: 'OrangeFox Device Tree Branch'
        required: true
        default: 'test-f-fox-reference'
      DEVICE_PATH:
        description: 'Specify your Device Path'
        required: true
        default: 'device/xiaomi/spinel'
      DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: true
        default: 'spinel'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'vendorboot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      MAGISK_VERSION:
        description: 'Specify your Magisk Version'
        required: true
        default: 'Magisk'
        type: choice
        options:
        - Magisk
        - MagiskAlpha
        - MagiskDelta
      ADD_WLAN_SUPPORT:
        description: 'Add WLAN support (EXPERIMENTAL!!)'
        type: boolean
        required: true
        default: false
      USE_CCACHE:
        description: Use ccache for compilation
        type: boolean
        required: true
        default: true

jobs:
  build:
    name: Build OrangeFox by ${{ github.actor }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: '3072'
        swap-size-mb: '8192'
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'

    - name: Install dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y \
          aria2 zram-tools bc bison build-essential ccache cpio curl \
          device-tree-compiler flex g++-multilib gcc-multilib git gnupg gperf \
          imagemagick libelf-dev liblz4-tool libncurses5-dev libssl-dev \
          libxml2 libxml2-utils lz4 pngcrush rsync schedtool squashfs-tools \
          unzip xsltproc zip zlib1g-dev mkbootimg

        # Script oficial de OrangeFox para preparar entornos de compilación Android en distros recientes
        git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master /tmp/ofox_scripts
        sudo bash /tmp/ofox_scripts/setup/android_build_env.sh
        rm -rf /tmp/ofox_scripts
        
    - name: Checkout
      uses: actions/checkout@main

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      if: inputs.USE_CCACHE
      with:
        max-size: "5G"
        create-symlink: true

    - name: Setup zram
      run: |
        sudo modprobe zram
        sudo sed -i 's/^#PERCENT=50/PERCENT=90/' /etc/default/zramswap || true
        sudo sed -i 's/^#PRIORITY=100/PRIORITY=1000/' /etc/default/zramswap || true
        sudo systemctl restart zramswap
        zramctl

    - name: Sync OrangeFox
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git clone https://gitlab.com/OrangeFox/sync.git -b master sync
        cd sync

        # Heartbeat para evitar timeout de GitHub Actions
        ( while sleep 60; do echo "Heartbeat (Sincronizando)..."; df -h; done ) &
        HEARTBEAT_PID=$!
        trap 'kill "$HEARTBEAT_PID" 2>/dev/null || true' EXIT

        MAX_RETRIES=3
        COUNT=0
        until ./orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }} || [ $COUNT -eq $MAX_RETRIES ]; do
          COUNT=$((COUNT+1))
          echo "La sincronización falló. Reintentando ($COUNT/$MAX_RETRIES)..."
          sleep 10
        done
        
        kill "$HEARTBEAT_PID" 2>/dev/null || true
        trap - EXIT
        
        if [ $COUNT -eq $MAX_RETRIES ]; then
          echo "Error fatal: No se pudo sincronizar el manifiesto."
          exit 1
        fi

    - name: Clone Android13+ Dependencies For 12.1 Branch
      if: inputs.MANIFEST_BRANCH == '12.1'
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        sed -i 's/<project name="android_hardware_qcom_bootctrl" path="hardware\/qcom-caf\/bootctrl" remote="LineageOS" revision="lineage-19.1-caf" \/>/<project name="android_hardware_qcom_bootctrl" path="hardware\/qcom-caf\/bootctrl" remote="LineageOS" revision="lineage-21.0-caf" \/>/g' .repo/manifests/twrp-default.xml
        sed -i '/<!-- Include phh'\''s treble repo for lptools support -->/i \    <!-- Include libmicrohttpd for TWRP -->\n    <project name="adontoo/android_external_libmicrohttpd" path="external/libmicrohttpd" remote="github" revision="ofox-14.1" />\n' .repo/manifests/twrp-default.xml
        sed -i '/<project path="bootable\/recovery" name="android_bootable_recovery" remote="TeamWin" revision="android-12.1"\/>/d' .repo/manifests/twrp-default.xml
        mv bootable/recovery bootable/recovery-ofrp
        repo sync
        mv bootable/recovery-ofrp bootable/recovery
        cd bionic/
        wget "https://github.com/adontoo/OrangeFox-android_platform_bionic/commit/85b1a7100083006927376f30bb8a67885c6dd71f.patch" -O bionic.patch
        git am bionic.patch
        cd ../external/libmicrohttpd
        sed -i 's/^static enum MHD_Result send_response/static enum MHD_Result __attribute__((unused)) send_response/' server.c

    - name: Patching the Source Code For 12.1 Branch
      if: inputs.MANIFEST_BRANCH == '12.1'
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/bootable/recovery
        git remote add ymdzq https://github.com/ymdzq/OrangeFox_Recovery && git fetch ymdzq fox_12.1 && git merge --no-ff ymdzq/fox_12.1 -m "Apply custom patches"
        if [ "${{ inputs.ADD_WLAN_SUPPORT }}" = "true" ]; then
          wget "https://github.com/ymdzq/OrangeFox_Recovery/commit/f8712872b9ec663b658a1e8eba4840877fe45ea6.patch" -O wlan.patch
          git am wlan.patch
          wget "https://github.com/ymdzq/OrangeFox_Recovery/commit/55743730c43681a777c4eacddd9d64a84dce3a54.patch" -O wlan2.patch
          git am wlan2.patch
        fi

    - name: Add WLAN support For 14.1 Branch
      if: inputs.MANIFEST_BRANCH == '14.1' && inputs.ADD_WLAN_SUPPORT
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        git clone https://github.com/adontoo/android_external_libmicrohttpd -b ofox-14.1 external/libmicrohttpd
        rm -rf bionic
        git clone https://github.com/adontoo/OrangeFox-android_platform_bionic bionic
        cd bootable/recovery
        wget "https://github.com/adontoo/device_xiaomi_sm8750_OFRP/raw/refs/heads/fox_14.1/patches/ofox_bootable_recovery.patch" -O wlan.patch
        git apply wlan.patch
        wget "https://github.com/ymdzq/OrangeFox_Recovery/commit/55743730c43681a777c4eacddd9d64a84dce3a54.patch" -O wlan2.patch
        git apply wlan2.patch

    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
        cd ${{ inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Download and prepare magiskboot
      run: |
        DOWNLOAD_URL=$(curl -s "https://api.github.com/repos/topjohnwu/Magisk/releases?per_page=1&include_prereleases=true" | jq -r '.[0].assets[] | select(.name | test("Magisk-.*\\.apk")) | .browser_download_url')

        if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
          echo "Error: No se pudo obtener la URL de descarga de Magisk."
          exit 1
        fi

        echo "Descargando desde: $DOWNLOAD_URL"
        curl -L --retry 3 "$DOWNLOAD_URL" -o Magisk.apk

        mkdir -p ~/magiskboot
        unzip -q Magisk.apk "lib/*/libmagiskboot.so" -d ~/magiskboot

        FOX_PATH="${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}"
        mkdir -p "${FOX_PATH}/vendor/recovery/prebuilt/arm"
        mkdir -p "${FOX_PATH}/vendor/recovery/prebuilt/arm64"
        mkdir -p "${FOX_PATH}/vendor/recovery/tools"

        cp -f ~/magiskboot/lib/armeabi-v7a/libmagiskboot.so "${FOX_PATH}/vendor/recovery/prebuilt/arm/magiskboot_updated"
        cp -f ~/magiskboot/lib/arm64-v8a/libmagiskboot.so "${FOX_PATH}/vendor/recovery/prebuilt/arm64/magiskboot_updated"
        cp -f ~/magiskboot/lib/x86_64/libmagiskboot.so "${FOX_PATH}/vendor/recovery/tools/magiskboot"

    - name: Building OrangeFox
      shell: bash
      run: |
        set -euo pipefail
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        
        if [ "${{ inputs.USE_CCACHE }}" = "true" ]; then
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/local/bin/ccache
          sed -i 's/return sandboxConfig\.working/return false/g' build/soong/ui/build/sandbox_linux.go || true
        fi
        
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        
        if [ "${{ inputs.MANIFEST_BRANCH }}" = "14.1" ]; then
          lunch twrp_${{ inputs.DEVICE_NAME }}-ap2a-eng
        else
          lunch twrp_${{ inputs.DEVICE_NAME }}-eng
        fi
        
        make clean
        mka adbd ${{ inputs.BUILD_TARGET }}image

    - name: Build system-compatible vendor_boot
      if: inputs.BUILD_TARGET == 'vendorboot'
      shell: bash
      run: |
        set -euo pipefail
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}

        chmod +x device/xiaomi/${{ inputs.DEVICE_NAME }}/tools/prepare-platform-ramdisk.sh
        chmod +x device/xiaomi/${{ inputs.DEVICE_NAME }}/tools/build-system-compatible-vendor-boot.sh

        device/xiaomi/${{ inputs.DEVICE_NAME }}/tools/prepare-platform-ramdisk.sh
        device/xiaomi/${{ inputs.DEVICE_NAME }}/tools/build-system-compatible-vendor-boot.sh
        
    - name: Set Release Properties
      run: |
        echo "BUILD_DATE=$(TZ=America/Managua date +%Y%m%d)" >> $GITHUB_ENV
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        
        DEVICE_TREE_URL="${{ inputs.DEVICE_TREE }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: Upload to Release
      uses: softprops/action-gh-release@master
      with:
        files: |
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.img
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.zip
        name: OrangeFox Recovery for ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          ## OrangeFox Recovery Build - Unofficial
          Build: fox_${{ inputs.MANIFEST_BRANCH }}
          Device: [Device Tree/Branch](${{ env.DEVICE_TREE_URL }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }}) during building.
